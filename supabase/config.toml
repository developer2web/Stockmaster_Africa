project_id = "stockmaster"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://app-web-export.vercel.app"
additional_redirect_urls = [
  "stockmaster://**",
  "http://localhost:8081/**",
  "http://localhost:4173/**",
  "http://localhost:4174/**",
  "http://localhost:4175/**",
  "https://stockmaster.africa/**",
  "https://app.stockmaster.africa/**",
  "https://account.stockmaster.africa/**",
  "https://admin.stockmaster.africa/**",
  "https://app-web-export.vercel.app/**",
  "https://public-web-silk.vercel.app/**",
  "https://account-web-three.vercel.app/**",
  "https://admin-web-kappa-seven.vercel.app/**"
]

[functions.invite-employee]
verify_jwt = true

[functions.change-temporary-password]
verify_jwt = true

[functions.account-portal-link]
verify_jwt = true

[functions.bootstrap-super-admin]
verify_jwt = false

[functions.create-payment]
verify_jwt = true

[functions.renew-subscription]
verify_jwt = true

[functions.check-payment-status]
verify_jwt = true

[functions.payment-webhook]
verify_jwt = false

[functions.notification-email]
verify_jwt = false

[functions.super-admin-configuration]
verify_jwt = true

# Emails d'authentification en français (26/09). Seuls l'objet et le contenu sont
# déclarés : la configuration d'envoi (SMTP Resend, nom d'expéditeur) reste gérée
# dans le tableau de bord et n'est pas touchée par `supabase config push`.
[auth.email.template.confirmation]
subject = "Confirmez votre adresse email StockMaster"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Réinitialisation de votre mot de passe StockMaster"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirmez votre nouvelle adresse email StockMaster"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.invite]
subject = "Vous êtes invité sur StockMaster"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Votre lien de connexion StockMaster"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.reauthentication]
subject = "Votre code de vérification StockMaster"
content_path = "./supabase/templates/reauthentication.html"
